<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" width="660" height="310" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172b4d"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052cc"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bf2600"/></marker></defs>
<rect width="660" height="310" fill="#ffffff"/>
<text x="330" y="20" font-size="12.5" fill="#172b4d" text-anchor="middle" font-weight="700" >setState는 '줄 세우기'. 같은 이벤트에서 addCard를 두 번 부르면?</text><text x="160" y="50" font-size="12" fill="#bf2600" text-anchor="middle" font-weight="700" >값 형태  setBoard({ ...board })</text><rect x="30" y="62" width="260" height="30" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="160.0" y="80.83333333333333" text-anchor="middle"   font-size="11.5" fill="#172b4d">현재 board = 카드 2개</text><rect x="30" y="102" width="125" height="44" rx="6" fill="#ffebe6" stroke="#172b4d" stroke-width="1.5"/><text x="92.5" y="120.16666666666667" text-anchor="middle"   font-size="11" fill="#172b4d">호출 1</text><text x="92.5" y="135.16666666666669" text-anchor="middle"   font-size="11" fill="#172b4d">board(2개) → 3개</text><rect x="165" y="102" width="125" height="44" rx="6" fill="#ffebe6" stroke="#172b4d" stroke-width="1.5"/><text x="227.5" y="120.16666666666667" text-anchor="middle"   font-size="11" fill="#172b4d">호출 2</text><text x="227.5" y="135.16666666666669" text-anchor="middle"   font-size="11" fill="#172b4d">board(2개) → 3개</text><text x="160" y="166" font-size="11" fill="#bf2600" text-anchor="middle"  >둘 다 낡은 board를 읽음</text><line x1="160" y1="172" x2="160" y2="192" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><rect x="60" y="192" width="200" height="30" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="160.0" y="210.83333333333334" text-anchor="middle"   font-size="11.5" fill="#172b4d">줄: [3개짜리, 3개짜리]</text><line x1="160" y1="222" x2="160" y2="242" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><rect x="60" y="242" width="200" height="30" rx="6" fill="#ffebe6" stroke="#172b4d" stroke-width="1.5"/><text x="160.0" y="260.6666666666667" text-anchor="middle"   font-size="11" fill="#172b4d">마지막 것 적용 → 카드 3개. A 사라짐</text><text x="500" y="50" font-size="12" fill="#006644" text-anchor="middle" font-weight="700" >함수 형태  setBoard(prev => ...)</text><rect x="370" y="62" width="260" height="30" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="500.0" y="80.83333333333333" text-anchor="middle"   font-size="11.5" fill="#172b4d">현재 board = 카드 2개</text><rect x="370" y="102" width="125" height="44" rx="6" fill="#e3fcef" stroke="#172b4d" stroke-width="1.5"/><text x="432.5" y="120.16666666666667" text-anchor="middle"   font-size="11" fill="#172b4d">호출 1</text><text x="432.5" y="135.16666666666669" text-anchor="middle"   font-size="11" fill="#172b4d">레시피 A 등록</text><rect x="505" y="102" width="125" height="44" rx="6" fill="#e3fcef" stroke="#172b4d" stroke-width="1.5"/><text x="567.5" y="120.16666666666667" text-anchor="middle"   font-size="11" fill="#172b4d">호출 2</text><text x="567.5" y="135.16666666666669" text-anchor="middle"   font-size="11" fill="#172b4d">레시피 B 등록</text><text x="500" y="166" font-size="11" fill="#006644" text-anchor="middle"  >아직 아무것도 계산 안 함</text><line x1="500" y1="172" x2="500" y2="192" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><rect x="400" y="192" width="200" height="30" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="500.0" y="210.83333333333334" text-anchor="middle"   font-size="11.5" fill="#172b4d">줄: [레시피A, 레시피B]</text><line x1="500" y1="222" x2="500" y2="242" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><rect x="380" y="242" width="240" height="30" rx="6" fill="#e3fcef" stroke="#172b4d" stroke-width="1.5"/><text x="500.0" y="260.6666666666667" text-anchor="middle"   font-size="11" fill="#172b4d">A(2개)→3개, B(3개)→4개. 둘 다 남음</text><text x="330" y="295" font-size="11" fill="#5e6c84" text-anchor="middle"  >적용 시점은 둘 다 '다음 렌더'. 차이는 뭘 읽느냐: 클로저의 낡은 값 vs React가 넣어주는 최신 값.</text></svg>