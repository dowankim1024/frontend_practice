<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172b4d"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052cc"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bf2600"/></marker></defs>
<rect width="760" height="330" fill="#ffffff"/>
<text x="330" y="20" font-size="12.5" fill="#172b4d" text-anchor="middle" font-weight="700" >prop drilling (2단계) vs Context (3단계)</text><text x="150" y="48" font-size="12" fill="#bf2600" text-anchor="middle" font-weight="700" >택배: 층마다 손으로 전달</text><rect x="90" y="62" width="120" height="34" rx="6" fill="#fff7d6" stroke="#172b4d" stroke-width="1.5"/><text x="150.0" y="83.0" text-anchor="middle"   font-size="12" fill="#172b4d">App</text><line x1="150" y1="96" x2="150" y2="120" stroke="#bf2600" stroke-width="1.6"  marker-end="url(#ar)"/><text x="215" y="102.0" text-anchor="middle" font-size="11.5" fill="#bf2600">dispatch 통과</text><rect x="90" y="120" width="120" height="34" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="150.0" y="141.0" text-anchor="middle"   font-size="12" fill="#172b4d">Board</text><line x1="150" y1="154" x2="150" y2="178" stroke="#bf2600" stroke-width="1.6"  marker-end="url(#ar)"/><text x="215" y="160.0" text-anchor="middle" font-size="11.5" fill="#bf2600">dispatch 통과</text><rect x="90" y="178" width="120" height="34" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="150.0" y="199.0" text-anchor="middle"   font-size="12" fill="#172b4d">Column</text><line x1="150" y1="212" x2="150" y2="236" stroke="#bf2600" stroke-width="1.6"  marker-end="url(#ar)"/><text x="215" y="218.0" text-anchor="middle" font-size="11.5" fill="#bf2600">dispatch 통과</text><rect x="90" y="236" width="120" height="34" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="150.0" y="257.0" text-anchor="middle"   font-size="12" fill="#172b4d">Card</text><text x="150" y="300" font-size="10.5" fill="#bf2600" text-anchor="middle"  >Board, Column은 dispatch를 쓰지도 않는데 받아서 넘김</text><text x="150" y="315" font-size="10.5" fill="#bf2600" text-anchor="middle"  >콜백이 하나 늘면 세 파일을 다 고쳐야 함</text><text x="480" y="48" font-size="12" fill="#006644" text-anchor="middle" font-weight="700" >와이파이: 옥상에 공유기 한 대</text><rect x="380" y="62" width="200" height="34" rx="6" fill="#fff7d6" stroke="#172b4d" stroke-width="1.5"/><text x="480.0" y="82.66666666666667" text-anchor="middle"   font-size="11" fill="#172b4d">&lt;BoardProvider value=dispatch&gt;</text><rect x="420" y="120" width="120" height="34" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="480.0" y="141.0" text-anchor="middle"   font-size="12" fill="#172b4d">Board</text><line x1="480" y1="154" x2="480" y2="178" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><text x="545" y="160.0" text-anchor="middle" font-size="11.5" fill="#172b4d">card, columnId만</text><rect x="420" y="178" width="120" height="34" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="480.0" y="199.0" text-anchor="middle"   font-size="12" fill="#172b4d">Column</text><line x1="480" y1="212" x2="480" y2="236" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><text x="545" y="218.0" text-anchor="middle" font-size="11.5" fill="#172b4d">card, columnId만</text><rect x="420" y="236" width="120" height="34" rx="6" fill="#e3fcef" stroke="#172b4d" stroke-width="1.5"/><text x="480.0" y="257.0" text-anchor="middle"   font-size="12" fill="#172b4d">Card</text><path d="M585,80 C640,150 640,220 545,253" stroke="#0052cc" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#ab)"/><text x="650" y="175" font-size="11" fill="#0052cc" text-anchor="start">useBoardDispatch()</text><text x="480" y="300" font-size="10.5" fill="#006644" text-anchor="middle"  >Board, Column은 dispatch의 존재를 모름</text><text x="480" y="315" font-size="10.5" fill="#006644" text-anchor="middle"  >Card가 필요하니 Card가 직접 꺼냄</text></svg>