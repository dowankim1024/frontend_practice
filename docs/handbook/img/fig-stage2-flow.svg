<rect width="660" height="340" fill="#ffffff"/>
<text x="330" y="20" font-size="12.5" fill="#172b4d" text-anchor="middle" font-weight="700" >2단계: 데이터는 아래로, 사건은 위로. 보고서는 올라가며 한 칸씩 채워진다.</text><rect x="60" y="50" width="140" height="44" rx="6" fill="#fff7d6" stroke="#172b4d" stroke-width="1.5"/><text x="130.0" y="68.08333333333333" text-anchor="middle"   font-size="11.5" fill="#172b4d">App</text><text x="130.0" y="83.58333333333333" text-anchor="middle"   font-size="11.5" fill="#172b4d">useState + 함수 3개</text><rect x="60" y="120" width="140" height="44" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="130.0" y="138.08333333333334" text-anchor="middle"   font-size="11.5" fill="#172b4d">Board</text><text x="130.0" y="153.58333333333334" text-anchor="middle"   font-size="11.5" fill="#172b4d">통과만</text><rect x="60" y="190" width="140" height="44" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="130.0" y="208.08333333333334" text-anchor="middle"   font-size="11.5" fill="#172b4d">Column</text><text x="130.0" y="223.58333333333334" text-anchor="middle"   font-size="11.5" fill="#172b4d">column.id 끼움</text><rect x="60" y="260" width="140" height="44" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="130.0" y="278.0833333333333" text-anchor="middle"   font-size="11.5" fill="#172b4d">Card</text><text x="130.0" y="293.5833333333333" text-anchor="middle"   font-size="11.5" fill="#172b4d">버튼 클릭</text><line x1="100" y1="94" x2="100" y2="120" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><text x="78" y="101.0" text-anchor="middle" font-size="11.5" fill="#172b4d">data</text><line x1="160" y1="120" x2="160" y2="94" stroke="#bf2600" stroke-width="1.6"  marker-end="url(#ar)"/><line x1="100" y1="164" x2="100" y2="190" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><text x="78" y="171.0" text-anchor="middle" font-size="11.5" fill="#172b4d">data</text><line x1="160" y1="190" x2="160" y2="164" stroke="#bf2600" stroke-width="1.6"  marker-end="url(#ar)"/><line x1="100" y1="234" x2="100" y2="260" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><text x="78" y="241.0" text-anchor="middle" font-size="11.5" fill="#172b4d">data</text><line x1="160" y1="260" x2="160" y2="234" stroke="#bf2600" stroke-width="1.6"  marker-end="url(#ar)"/><text x="165" y="72" font-size="11" fill="#172b4d" text-anchor="start"  ></text><text x="450" y="42" font-size="12.5" fill="#172b4d" text-anchor="middle" font-weight="700" >올라가는 보고서</text><text x="240" y="278" font-size="11.5" fill="#172b4d" text-anchor="start" font-weight="700" >Card</text><text x="300" y="278" font-size="11" fill="#bf2600" text-anchor="start"  font-family="SF Mono, Menlo, monospace">onDelete()</text><text x="300" y="294" font-size="10.5" fill="#5e6c84" text-anchor="start"  >아무 칸도 안 채움. "나 지워줘"</text><text x="240" y="208" font-size="11.5" fill="#172b4d" text-anchor="start" font-weight="700" >Column</text><text x="300" y="208" font-size="11" fill="#bf2600" text-anchor="start"  font-family="SF Mono, Menlo, monospace">onDeleteCard(column.id, card.id)</text><text x="300" y="224" font-size="10.5" fill="#5e6c84" text-anchor="start"  >map 안에서 둘 다 아니까 여기서 채움</text><text x="240" y="138" font-size="11.5" fill="#172b4d" text-anchor="start" font-weight="700" >Board</text><text x="300" y="138" font-size="11" fill="#bf2600" text-anchor="start"  font-family="SF Mono, Menlo, monospace">onDeleteCard("300", "5")</text><text x="300" y="154" font-size="10.5" fill="#5e6c84" text-anchor="start"  >그대로 통과</text><text x="240" y="68" font-size="11.5" fill="#172b4d" text-anchor="start" font-weight="700" >App</text><text x="300" y="68" font-size="11" fill="#bf2600" text-anchor="start"  font-family="SF Mono, Menlo, monospace">deleteCard("300", "5")</text><text x="300" y="84" font-size="10.5" fill="#5e6c84" text-anchor="start"  >setBoard(filter로 새 보드)</text><text x="330" y="325" font-size="10.5" fill="#5e6c84" text-anchor="middle"  >포장지: onDelete={() => onDeleteCard(column.id, card.id)}  ← Column이 Card를 만들 때 주소를 미리 써서 주는 봉투</text></svg>