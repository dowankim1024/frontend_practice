<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 305" width="620" height="305" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172b4d"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052cc"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bf2600"/></marker></defs>
<rect width="620" height="305" fill="#ffffff"/>
<text x="300" y="22" font-size="12.5" fill="#172b4d" text-anchor="middle" font-weight="700" >1단계: 데이터는 props로만 아래로 흐른다. 각 컴포넌트는 받은 것을 그리기만 한다.</text><rect x="230" y="40" width="140" height="36" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="300.0" y="62.333333333333336" text-anchor="middle"   font-size="13" fill="#172b4d">App</text><text x="380" y="62" font-size="11" fill="#5e6c84" text-anchor="start"  >initialBoard (data.ts)</text><line x1="300" y1="76" x2="300" y2="100" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><text x="355" y="82.0" text-anchor="middle" font-size="11.5" fill="#172b4d">board: Board</text><rect x="230" y="100" width="140" height="36" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="300.0" y="122.33333333333333" text-anchor="middle"   font-size="13" fill="#172b4d">Board</text><text x="380" y="122" font-size="11" fill="#5e6c84" text-anchor="start"  font-family="SF Mono, Menlo, monospace">board.columns.map(...)</text><line x1="300" y1="136" x2="300" y2="160" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><text x="360" y="142.0" text-anchor="middle" font-size="11.5" fill="#172b4d">column: Column</text><rect x="230" y="160" width="140" height="36" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="300.0" y="182.33333333333334" text-anchor="middle"   font-size="13" fill="#172b4d">Column</text><text x="380" y="182" font-size="11" fill="#5e6c84" text-anchor="start"  font-family="SF Mono, Menlo, monospace">column.cards.map(...)</text><line x1="300" y1="196" x2="300" y2="220" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><text x="350" y="202.0" text-anchor="middle" font-size="11.5" fill="#172b4d">card: Card</text><rect x="230" y="220" width="140" height="36" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="300.0" y="242.33333333333334" text-anchor="middle"   font-size="13" fill="#172b4d">Card</text><text x="380" y="242" font-size="11" fill="#5e6c84" text-anchor="start"  font-family="SF Mono, Menlo, monospace">card.title, card.description</text><rect x="20" y="100" width="180" height="156" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="110.0" y="138.0" text-anchor="middle" font-family="SF Mono, Menlo, monospace"  font-size="10.5" fill="#172b4d">type.ts</text><text x="110.0" y="152.5" text-anchor="middle" font-family="SF Mono, Menlo, monospace"  font-size="10.5" fill="#172b4d"></text><text x="110.0" y="167.0" text-anchor="middle" font-family="SF Mono, Menlo, monospace"  font-size="10.5" fill="#172b4d">Board { columns: Column[] }</text><text x="110.0" y="181.5" text-anchor="middle" font-family="SF Mono, Menlo, monospace"  font-size="10.5" fill="#172b4d">Column { id, title,</text><text x="110.0" y="196.0" text-anchor="middle" font-family="SF Mono, Menlo, monospace"  font-size="10.5" fill="#172b4d">          cards: Card[] }</text><text x="110.0" y="210.5" text-anchor="middle" font-family="SF Mono, Menlo, monospace"  font-size="10.5" fill="#172b4d">Card { id, title,</text><text x="110.0" y="225.0" text-anchor="middle" font-family="SF Mono, Menlo, monospace"  font-size="10.5" fill="#172b4d">        description? }</text><text x="110" y="280" font-size="11" fill="#5e6c84" text-anchor="middle"  >도메인 타입 = 데이터 모양</text><text x="300" y="290" font-size="11" fill="#5e6c84" text-anchor="middle"  >Props 타입(BoardProps 등)은 각 컴포넌트 파일 안에. 콜백 같은 '데이터 아닌 것'이 들어갈 자리.</text></svg>