<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 280" width="670" height="280" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172b4d"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052cc"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bf2600"/></marker></defs>
<rect width="670" height="280" fill="#ffffff"/>
<text x="330" y="20" font-size="12.5" fill="#172b4d" text-anchor="middle" font-weight="700" >useReducer의 순환: dispatch → 리듀서 → 새 상태 → 리렌더</text><rect x="40" y="120" width="150" height="50" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="115.0" y="133.66666666666666" text-anchor="middle"   font-size="11" fill="#172b4d">Card</text><text x="115.0" y="148.66666666666666" text-anchor="middle"   font-size="11" fill="#172b4d">dispatch({ type:</text><text x="115.0" y="163.66666666666666" text-anchor="middle"   font-size="11" fill="#172b4d">"deleteCard", ... })</text><line x1="190" y1="145" x2="250" y2="145" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><text x="220" y="135" text-anchor="middle" font-size="11.5" fill="#172b4d">액션 객체</text><rect x="250" y="110" width="170" height="70" rx="6" fill="#fff7d6" stroke="#172b4d" stroke-width="1.5"/><text x="335.0" y="126.16666666666667" text-anchor="middle"   font-size="11" fill="#172b4d">boardReducer</text><text x="335.0" y="141.16666666666669" text-anchor="middle"   font-size="11" fill="#172b4d">(state, action)</text><text x="335.0" y="156.16666666666669" text-anchor="middle"   font-size="11" fill="#172b4d">→ 새 state</text><text x="335.0" y="171.16666666666669" text-anchor="middle"   font-size="11" fill="#172b4d">순수 함수</text><line x1="420" y1="145" x2="480" y2="145" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><text x="450" y="135" text-anchor="middle" font-size="11.5" fill="#172b4d">새 board</text><rect x="480" y="120" width="150" height="50" rx="6" fill="#e3fcef" stroke="#172b4d" stroke-width="1.5"/><text x="555.0" y="141.16666666666666" text-anchor="middle"   font-size="11" fill="#172b4d">BoardProvider</text><text x="555.0" y="156.16666666666666" text-anchor="middle"   font-size="11" fill="#172b4d">board 교체 → 리렌더</text><path d="M555,170 C555,230 115,230 115,170" stroke="#0052cc" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#ab)"/><text x="335" y="222" font-size="11" fill="#0052cc" text-anchor="middle"  >새 board가 Context로 내려와 Card가 다시 그려짐</text><text x="335" y="70" font-size="11.5" fill="#5e6c84" text-anchor="middle"  >React가 뒤에서 하는 일:  board = boardReducer(board, action)</text><text x="335" y="262" font-size="11" fill="#5e6c84" text-anchor="middle"  >리듀서는 React 없이도 호출 가능 → Node에서 직접 돌려 확인함 (3장 §4). 8단계 테스트의 대상.</text></svg>