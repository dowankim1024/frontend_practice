<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 255" width="620" height="255" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172b4d"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052cc"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bf2600"/></marker></defs>
<rect width="620" height="255" fill="#ffffff"/>
<text x="310" y="20" font-size="12.5" fill="#172b4d" text-anchor="middle" font-weight="700" >[A, B, C]에서 A를 삭제했을 때, React가 '누가 누구인지' 짝짓는 방식</text><text x="150" y="48" font-size="13" fill="#bf2600" text-anchor="middle" font-weight="700" >key = index</text><rect x="40" y="62" width="70" height="32" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="75.0" y="82.0" text-anchor="middle"   font-size="12" fill="#172b4d">key 0</text><rect x="120" y="62" width="50" height="32" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="145.0" y="82.0" text-anchor="middle"   font-size="12" fill="#172b4d">A</text><line x1="170" y1="78" x2="205" y2="78" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><rect x="205" y="62" width="50" height="32" rx="6" fill="#ffebe6" stroke="#172b4d" stroke-width="1.5"/><text x="230.0" y="82.0" text-anchor="middle"   font-size="12" fill="#172b4d">B</text><rect x="40" y="106" width="70" height="32" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="75.0" y="126.0" text-anchor="middle"   font-size="12" fill="#172b4d">key 1</text><rect x="120" y="106" width="50" height="32" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="145.0" y="126.0" text-anchor="middle"   font-size="12" fill="#172b4d">B</text><line x1="170" y1="122" x2="205" y2="122" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><rect x="205" y="106" width="50" height="32" rx="6" fill="#ffebe6" stroke="#172b4d" stroke-width="1.5"/><text x="230.0" y="126.0" text-anchor="middle"   font-size="12" fill="#172b4d">C</text><rect x="40" y="150" width="70" height="32" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="75.0" y="170.0" text-anchor="middle"   font-size="12" fill="#172b4d">key 2</text><rect x="120" y="150" width="50" height="32" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="145.0" y="170.0" text-anchor="middle"   font-size="12" fill="#172b4d">C</text><line x1="170" y1="166" x2="205" y2="166" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><rect x="205" y="150" width="50" height="32" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="230.0" y="170.0" text-anchor="middle"   font-size="12" fill="#172b4d">—</text><text x="150" y="205" font-size="11" fill="#bf2600" text-anchor="middle"  >"0번은 그대로, 내용만 A→B"</text><text x="150" y="221" font-size="11" fill="#bf2600" text-anchor="middle"  >→ A 인스턴스가 살아남아 B 옷을 입음</text><text x="150" y="237" font-size="11" fill="#bf2600" text-anchor="middle"  >→ A에 치던 input 값이 B에 남음</text><text x="470" y="48" font-size="13" fill="#006644" text-anchor="middle" font-weight="700" >key = id</text><rect x="360" y="62" width="70" height="32" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="395.0" y="82.0" text-anchor="middle"   font-size="12" fill="#172b4d">key A</text><rect x="440" y="62" width="50" height="32" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="465.0" y="82.0" text-anchor="middle"   font-size="12" fill="#172b4d">A</text><line x1="490" y1="78" x2="525" y2="78" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><rect x="525" y="62" width="80" height="32" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="565.0" y="81.83333333333333" text-anchor="middle"   font-size="11.5" fill="#172b4d">(사라짐)</text><rect x="360" y="106" width="70" height="32" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="395.0" y="126.0" text-anchor="middle"   font-size="12" fill="#172b4d">key B</text><rect x="440" y="106" width="50" height="32" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="465.0" y="126.0" text-anchor="middle"   font-size="12" fill="#172b4d">B</text><line x1="490" y1="122" x2="525" y2="122" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><rect x="525" y="106" width="80" height="32" rx="6" fill="#e3fcef" stroke="#172b4d" stroke-width="1.5"/><text x="565.0" y="125.83333333333333" text-anchor="middle"   font-size="11.5" fill="#172b4d">B</text><rect x="360" y="150" width="70" height="32" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="395.0" y="170.0" text-anchor="middle"   font-size="12" fill="#172b4d">key C</text><rect x="440" y="150" width="50" height="32" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="465.0" y="170.0" text-anchor="middle"   font-size="12" fill="#172b4d">C</text><line x1="490" y1="166" x2="525" y2="166" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><rect x="525" y="150" width="80" height="32" rx="6" fill="#e3fcef" stroke="#172b4d" stroke-width="1.5"/><text x="565.0" y="169.83333333333334" text-anchor="middle"   font-size="11.5" fill="#172b4d">C</text><text x="470" y="205" font-size="11" fill="#006644" text-anchor="middle"  >"A가 사라졌다"를 정확히 앎</text><text x="470" y="221" font-size="11" fill="#006644" text-anchor="middle"  >→ A 인스턴스만 언마운트</text><text x="470" y="237" font-size="11" fill="#006644" text-anchor="middle"  >→ B, C의 상태는 각자 따라감</text></svg>