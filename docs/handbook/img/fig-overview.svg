" width="160" height="34" rx="6" fill="#f4f5f7" stroke="#172b4d" stroke-width="1.5"/><text x="670.0" y="81.33333333333333" text-anchor="middle"   font-size="13" fill="#172b4d">App</text><rect x="580" y="104" width="180" height="46" rx="6" fill="#fff7d6" stroke="#172b4d" stroke-width="1.5"/><text x="670.0" y="123.08333333333333" text-anchor="middle"   font-size="11.5" fill="#172b4d">&lt;BoardProvider&gt;</text><text x="670.0" y="138.58333333333331" text-anchor="middle"   font-size="11.5" fill="#172b4d">useReducer → board, dispatch</text><line x1="670" y1="150" x2="670" y2="172" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><rect x="600" y="172" width="140" height="34" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="670.0" y="193.0" text-anchor="middle"   font-size="12" fill="#172b4d">Board  useBoard()</text><line x1="670" y1="206" x2="670" y2="228" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><rect x="600" y="228" width="140" height="34" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="670.0" y="249.0" text-anchor="middle"   font-size="12" fill="#172b4d">Column</text><line x1="670" y1="262" x2="670" y2="284" stroke="#172b4d" stroke-width="1.6"  marker-end="url(#a)"/><rect x="590" y="284" width="160" height="46" rx="6" fill="#deebff" stroke="#172b4d" stroke-width="1.5"/><text x="670.0" y="303.0833333333333" text-anchor="middle"   font-size="11.5" fill="#172b4d">Card / AddCardForm</text><text x="670.0" y="318.5833333333333" text-anchor="middle"   font-size="11.5" fill="#172b4d">useBoardDispatch()</text><path d="M760,127 C800,200 800,260 750,306" stroke="#0052cc" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#ab)"/><text x="790" y="225" font-size="11.5" fill="#0052cc" text-anchor="middle"  >Context</text><text x="400" y="340" font-size="11.5" fill="#5e6c84" text-anchor="middle"  >빨간 화살표 = 쓰지도 않는 콜백을 받아서 넘기기만 하는 구간 (prop drilling). 3단계에서 사라짐.</text></svg>